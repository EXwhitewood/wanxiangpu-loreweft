    description: 强调关系张力、情绪证据和人物选择。
    target_reader: 重视人物关系和情绪流动的读者
    metric_weights:
      reading_drive: 1.1
      clarity: 1.0
      dramatic_pressure: 1.1
      protagonist_agency: 1.0
      information_design: 0.8
      emotional_engagement: 1.6
      specificity: 1.1
      prose_identity: 0.9
      cultural_texture: 0.7
      experimental_form: 0.2
      intertextuality: 0.2
    experience_defaults:
      preferred_scene_pressure: [relationship_risk, unspoken_need, choice_cost]
      preferred_information_carriers: [dialogue, gesture, object_detail, silence]
      avoid: [emotion_label_without_behavior, abstract_relationship_summary]
    literary_quality_defaults:
      abstraction_ceiling: medium
      specificity_requirement: high
      dialogue_pressure_requirement: high
      prose_distinctiveness_requirement: medium
      intertextuality_requirement: low
      cultural_texture_requirement: medium
    style_interaction:
      style_hard_rules_override_quality: true
      allow_quality_to_request_style_negotiation: true
      conflict_policy: negotiate
    revision_policy:
      local_patch_allowed: [emotion_to_scene_evidence, generic_detail_to_specific_detail]
      structural_rewrite_allowed: [missing_relationship_pressure, passive_protagonist]
      never_change: [fact_contract, responsibility, pov_boundary, established_event_outcome]

  - id: light_comedy
    label: 轻喜剧
    description: 强调互动节奏、误差感、人物反应和轻快钩子。
    target_reader: 喜欢轻松互动和节奏反差的读者
    metric_weights:
      reading_drive: 1.3
      clarity: 1.1
      dramatic_pressure: 1.0
      protagonist_agency: 1.1
      information_design: 0.8
      emotional_engagement: 1.0
      specificity: 0.9
      prose_identity: 1.0
      cultural_texture: 0.4
      experimental_form: 0.2
      intertextuality: 0.2
    experience_defaults:
      preferred_scene_pressure: [social_mismatch, expectation_flip, awkward_choice]
      preferred_information_carriers: [dialogue, action, reaction, object_detail]
      avoid: [overexplained_joke, abstract_moral_summary, heavy_symbolic_delay]
    literary_quality_defaults:
      abstraction_ceiling: low
      specificity_requirement: medium
      dialogue_pressure_requirement: high
      prose_distinctiveness_requirement: medium
      intertextuality_requirement: low
      cultural_texture_requirement: low
    style_interaction:
      style_hard_rules_override_quality: true
      allow_quality_to_request_style_negotiation: true
      conflict_policy: negotiate
    revision_policy:
      local_patch_allowed: [dialogue_timing_patch, repeated_sentence_pattern, weak_hook_patch]
      structural_rewrite_allowed: [missing_interaction_pressure]
      never_change: [fact_contract, responsibility, pov_boundary, established_event_outcome]

  - id: experimental
    label: 实验
    description: 允许形式探索，但仍要求内部规则自洽、体验目标明确。
    target_reader: 接受形式探索的小说读者
    metric_weights:
      reading_drive: 0.7
      clarity: 0.7
      dramatic_pressure: 0.8
      protagonist_agency: 0.7
      information_design: 1.0
      emotional_engagement: 1.0
      specificity: 1.1
      prose_identity: 1.5
      cultural_texture: 0.8
      experimental_form: 1.4
      intertextuality: 0.8
    experience_defaults:
      preferred_scene_pressure: [formal_tension, perception_gap, internal_contradiction]
      preferred_information_carriers: [sensory_observation, motif, fragment, object_detail]
      avoid: [randomness_without_rule, form_without_scene_work]
    literary_quality_defaults:
      abstraction_ceiling: high
      specificity_requirement: medium
      dialogue_pressure_requirement: low
      prose_distinctiveness_requirement: high
      intertextuality_requirement: medium
      cultural_texture_requirement: medium
    style_interaction:
      style_hard_rules_override_quality: true
      allow_quality_to_request_style_negotiation: true
      conflict_policy: negotiate
    revision_policy:
      local_patch_allowed: [rule_clarification_patch, generic_detail_to_specific_detail]
      structural_rewrite_allowed: [form_without_rule, no_reader_hook]
      never_change: [fact_contract, responsibility, pov_boundary, established_event_outcome]
