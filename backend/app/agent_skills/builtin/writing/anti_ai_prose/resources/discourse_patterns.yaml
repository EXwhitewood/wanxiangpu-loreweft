paragraph_shape_notes:
  - "连续段落若使用相同句数、相同长短句顺序和总结句结尾，应视为同构风险。"
  - "动作已经表达情绪后，下一句再以这说明/这意味着解释，视为动作后解释。"
  - "两个相邻句字符二元组高度相似，且没有新增事实，视为语义复述候选。"
