  sentence_distribution:
    average: null
    short_ratio: null
    long_ratio: null
  punctuation_habits:
    preferred: []
    avoided: []
  lexical_register:
    level: null
    preferred_words: []
    avoided_words: []
  observation_domains:
    profession: []
    sensory: []
    relationship: []
    material_culture: []
  metaphor_source_domains: []
  transition_habits: []
