name: 故障报告
description: 报告可复现的软件问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿在截图或日志中公开 API Key、访问令牌或未发布的作品正文。
  - type: input
    id: version
    attributes:
      label: 万象谱版本
      placeholder: 例如 0.3.5
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 出现位置
      options:
        - Windows 桌面端
        - 浏览器开发版
        - 后端服务
        - 安装或更新
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出从打开软件到出现问题的完整操作顺序。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与日志
      description: 可附截图和已脱敏日志。
    validations:
      required: true
